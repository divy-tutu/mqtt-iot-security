services:
  broker:
    image: eclipse-mosquitto:2
    container_name: broker
    ports:
      - "1883:1883"   # raw MQTT/TCP — devices + attack scripts
      - "9001:9001"   # MQTT over WebSockets — browser frontend (MQTT.js)
    volumes:
      - ./broker/config/mosquitto.undefended.conf:/mosquitto/config/mosquitto.conf:ro

  sensor:
    build: ./devices
    container_name: sensor
    command: python sensor.py
    depends_on:
      - broker
    restart: unless-stopped

  lock:
    build: ./devices
    container_name: lock
    command: python lock.py
    depends_on:
      - broker
    restart: unless-stopped

  camera:
    build: ./devices
    container_name: camera
    command: python camera.py
    depends_on:
      - broker
    restart: unless-stopped
