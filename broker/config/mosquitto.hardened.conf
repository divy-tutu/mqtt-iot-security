listener 8883
allow_anonymous false
password_file /credentials/passwd
acl_file /mosquitto/config/acl
cafile /public/ca.crt
certfile /tls/server.crt
keyfile /tls/server.key
tls_version tlsv1.2
max_connections 50
max_packet_size 8192
max_inflight_messages 20
max_queued_messages 100
max_keepalive 120
# Queues bound backlog; they are NOT a publish-rate limit.
persistence false
log_dest stdout
log_type all
