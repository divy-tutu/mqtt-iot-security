# ============================================================================
#  HARDENED broker config  (Phase 2 - Defensive Hardening)
#  Counterpart to mosquitto.undefended.conf. The device fleet and topic
#  structure are identical to Phase 1; only the security configuration differs,
#  so this file isolates the causal effect of the broker-layer controls.
#
#  Loaded explicitly via `mosquitto -c .../mosquitto.hardened.conf`
#  (see docker-compose.hardened.yml).
# ============================================================================

# --- Control 1: Access control (authentication) ----------------------------
# Anonymous access is OFF. Every client MUST present valid credentials from the
# password file. This alone blocks the Phase-1 unauthorized-access attack.
allow_anonymous false
password_file /mosquitto/config/passwd

# --- Control 1: Access control (per-topic authorization) --------------------
# Least-privilege ACLs: each identity may only read/write its own topics.
# Defeats masquerade / spoofing / modification at the broker.
acl_file /mosquitto/config/acl

# --- Control 6: Availability (message caps) ---------------------------------
# Bound the per-client in-flight / queued backlog and keepalive so a flood
# cannot exhaust broker memory. (Per-connection caps are set per-listener
# below; fine-grained publish-rate limiting is left to the detection layer.)
max_inflight_messages 20
max_queued_messages 100
max_keepalive 120
max_packet_size 8192

persistence true
persistence_location /mosquitto/data/

# Logging (accountability evidence; also useful for the attack-vs-defence
# comparison captures).
log_dest stdout
log_type all
connection_messages true
log_timestamp true

# ----------------------------------------------------------------------------
#  Control 2: Confidentiality (TLS). Both listeners require TLS; there is
#  deliberately NO plaintext 1883 / ws 9001 here, unlike the undefended broker.
#  `max_connections` is set per-listener (Control 6) to blunt connection-flood.
# ----------------------------------------------------------------------------

# Secure MQTT over TLS/TCP - used by the hardened devices and attack re-runs.
listener 8883
protocol mqtt
max_connections 50
cafile   /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile  /mosquitto/certs/server.key
tls_version tlsv1.2

# Secure MQTT over TLS WebSockets (wss) - for the hardened browser dashboard.
listener 9002
protocol websockets
max_connections 50
cafile   /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile  /mosquitto/certs/server.key
tls_version tlsv1.2
