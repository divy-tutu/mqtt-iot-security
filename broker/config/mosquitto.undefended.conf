# --- UNDEFENDED / INSECURE broker config (intentionally vulnerable) ---
# Anonymous access is left ON: this is the vulnerability being demonstrated.

# Raw MQTT over TCP — used by the devices (devices/*.py) and the attack
# scripts (attacks/*.py). Do not remove.
listener 1883
protocol mqtt

# MQTT over WebSockets — browsers cannot open raw TCP sockets, so the
# frontend (MQTT.js) connects here at ws://<host>:9001.
listener 9001
protocol websockets

# No authentication. Any client may connect, subscribe to '#', and publish
# to any topic — including forging home/frontdoor/lock/state.
allow_anonymous true
