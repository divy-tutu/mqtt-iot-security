# ============================================================================
#  Phase 2 - HARDENED stack.
#
#  Runs as an isolated compose project (`name:` below) on its own network and
#  on different host ports (8883/9002 vs 1883/9001), so it can coexist with the
#  undefended Phase-1 stack. Same device fleet and topic structure as Phase 1 -
#  only the security configuration differs.
#
#  Trust material is provisioned at build/run time and mounted READ-ONLY:
#    - broker/certs/   TLS CA + server cert   (run broker/certs/gen-certs.sh)
#    - broker/config/  passwd + acl           (hashed credentials, per-topic ACL)
#    - secrets/        per-device HMAC keys
#
#  Bring up:   docker compose -f docker-compose.hardened.yml up -d --build
#  Tear down:  docker compose -f docker-compose.hardened.yml down
# ============================================================================
name: mqtt-iot-security-hardened

services:
  broker:
    image: eclipse-mosquitto:2
    # Load the hardened config explicitly. The whole config dir is mounted (not
    # individual files) because Docker Desktop presents single-file bind mounts
    # as 0600-root, which the mosquitto user cannot read; directory mounts are
    # world-readable.
    command: mosquitto -c /mosquitto/config/mosquitto.hardened.conf
    ports:
      - "8883:8883"   # MQTT over TLS      - hardened devices + attack re-runs
      - "9002:9002"   # MQTT over TLS+WSS  - hardened browser dashboard
    volumes:
      - ./broker/config:/mosquitto/config:ro
      - ./broker/certs:/mosquitto/certs:ro
      - hardened_data:/mosquitto/data

  sensor:
    build: ./devices
    command: python sensor_secure.py
    depends_on: [broker]
    restart: unless-stopped
    environment:
      MQTT_HOST: broker            # matches the TLS cert SAN
      MQTT_PORT: "8883"
      MQTT_USERNAME: sensor-livingroom
      MQTT_PASSWORD: sensor-pass-2026
      CA_CERT: /certs/ca.crt
      HMAC_KEY_FILE: /run/keys/hmac.key
    volumes:
      - ./broker/certs:/certs:ro
      - ./secrets/sensor-livingroom.hmac.key:/run/keys/hmac.key:ro

  lock:
    build: ./devices
    command: python lock_secure.py
    depends_on: [broker]
    restart: unless-stopped
    environment:
      MQTT_HOST: broker
      MQTT_PORT: "8883"
      MQTT_USERNAME: lock-frontdoor
      MQTT_PASSWORD: lock-pass-2026
      CA_CERT: /certs/ca.crt
      HMAC_KEY_FILE: /run/keys/hmac.key          # signs its own state
      OPERATOR_KEY_FILE: /run/keys/operator.key  # verifies operator commands
      AUDIT_LOG: /audit/lock-frontdoor.log
    volumes:
      - ./broker/certs:/certs:ro
      - ./secrets/lock-frontdoor.hmac.key:/run/keys/hmac.key:ro
      - ./secrets/dashboard.hmac.key:/run/keys/operator.key:ro
      - ./audit:/audit

  camera:
    build: ./devices
    command: python camera_secure.py
    depends_on: [broker]
    restart: unless-stopped
    environment:
      MQTT_HOST: broker
      MQTT_PORT: "8883"
      MQTT_USERNAME: camera-frontdoor
      MQTT_PASSWORD: camera-pass-2026
      CA_CERT: /certs/ca.crt
      HMAC_KEY_FILE: /run/keys/hmac.key
    volumes:
      - ./broker/certs:/certs:ro
      - ./secrets/camera-frontdoor.hmac.key:/run/keys/hmac.key:ro

volumes:
  hardened_data:
