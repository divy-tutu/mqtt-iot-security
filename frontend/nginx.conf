server {
    listen 8080;
    return 308 https://$host:8443$request_uri;
}

server {
    listen 8443 ssl;
    root /usr/share/nginx/html;
    resolver 127.0.0.11 valid=5s ipv6=off;

    ssl_certificate /tls/server.crt;
    ssl_certificate_key /tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 10m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;
    # camera=(self): allow the webcam preview card to request the camera
    # on THIS page only — still denied to any embedded/third-party origin.
    # microphone/geolocation stay fully denied since nothing here needs them.
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;

    location /api/baseline/ {
        set $backend baseline-gateway;
        rewrite ^/api/baseline/(.*)$ /$1 break;
        proxy_pass http://$backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_cookie_flags ~ secure httponly samesite=strict;
    }
    location /api/hardened/ {
        set $backend hardened-gateway;
        rewrite ^/api/hardened/(.*)$ /$1 break;
        proxy_pass http://$backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_cookie_flags ~ secure httponly samesite=strict;
    }
    location / { try_files $uri $uri/ /index.html; }
}
